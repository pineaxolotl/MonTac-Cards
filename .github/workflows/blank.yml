name: Manual Test

on:
  workflow_dispatch:  # <-- This enables the manual trigger

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run the script
        run: python MonTacle/pickMonTacle.py
